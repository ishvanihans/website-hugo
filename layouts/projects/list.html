{{ define "main" }}
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <div class="time-list">
        <ul>
            {{ range (.Pages.GroupByParam "area") }}
            <li>
               <strong>{{ .Key }} ({{ len .Pages }})</strong>

               <ul>
               {{ range .Pages }}
                    <li>
                        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
                    </li>
                {{ end }}
                </ul>
            </li>
        {{ end }}
        </ul>
    </div>
{{ end }}
