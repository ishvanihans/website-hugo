{{ define "main" }}
  <h1>{{ .Title }}</h1>

  {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}

  {{ .Content }}

  {{ if eq .Section "posts" }}
    {{ partial "date.html" .Date }}
  {{ end }}

  {{ if not .IsHome }}
    <div class="terminal-nav">
      <div class="back-nav">
        <a href="../" class="back-link">../</a>
      </div>
    </div>
  {{ end }}
{{ end }}
